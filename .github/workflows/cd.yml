name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smart-schedule-backend:latest

      - name: Prepare directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/smart-schedule-backend/nginx ~/smart-schedule-backend/certbot/www

      - name: Copy compose and nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,nginx/default.conf
          target: ~/smart-schedule-backend

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE
          script: |
            cd ~/smart-schedule-backend
            printf '%s\n' "$ENV_FILE" > .env

            docker compose pull smart-schedule-app
            docker compose up -d --remove-orphans
            docker compose exec -T smart-schedule-nginx nginx -s reload || docker compose restart smart-schedule-nginx
            docker image prune -f

            echo "Starting health check..."
            for i in $(seq 1 10); do
              RESPONSE=$(curl -sf http://localhost/health || true)
              if [ "$RESPONSE" = "OK" ]; then
                echo "Health check passed!"
                exit 0
              fi
              echo "Waiting for server... ($i/10)"
              sleep 10
            done
            echo "Health check failed."
            exit 1

services:
  smart-schedule-mysql:
    image: mysql:8.0
    container_name: smart-schedule-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smart-schedule-network

  smart-schedule-redis:
    image: 'redis:alpine'
    container_name: smart-schedule-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smart-schedule-network

  smart-schedule-app:
    image: ${DOCKERHUB_USERNAME}/smart-schedule-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-schedule-app
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE_URL: jdbc:mysql://smart-schedule-mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: smart-schedule-redis
    depends_on:
      smart-schedule-mysql:
        condition: service_healthy
      smart-schedule-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:8080/health | grep -q OK']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - smart-schedule-network

  smart-schedule-nginx:
    image: nginx:alpine
    container_name: smart-schedule-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      smart-schedule-app:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health | grep -q OK']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smart-schedule-network

  smart-schedule-certbot:
    image: certbot/certbot:latest
    container_name: smart-schedule-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - smart-schedule-network

networks:
  smart-schedule-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

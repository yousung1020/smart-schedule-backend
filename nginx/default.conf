upstream smart-schedule-app {
    server smart-schedule-app:8080;
}

server {
    listen 80;
    server_name smart-schedule.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # CD·EC2 내부 헬스체크용 (HTTPS 리다이렉트 제외)
    location = /health {
        proxy_pass http://smart-schedule-app/health;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name smart-schedule.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/smart-schedule.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart-schedule.kro.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 10M;

    location = /health {
        proxy_pass http://smart-schedule-app/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://smart-schedule-app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /swagger-ui/ {
        proxy_pass http://smart-schedule-app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /v3/api-docs {
        proxy_pass http://smart-schedule-app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / {
        return 404;
    }
}
